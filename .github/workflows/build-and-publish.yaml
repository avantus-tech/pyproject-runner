name: Build and Publish

on:
  release:
    types: [published]

jobs:
  build:
    uses: ./.github/workflows/build.yaml
    with:
      tag-name: ${{ github.event.release.tag_name }}

  publish:
    uses: ./.github/workflows/publish.yaml
    needs: build
    with:
      tag-name: ${{ github.event.release.tag_name }}
      test-release: ${{ github.event.release.prerelease }}
